# Render Blueprint (FREE plans): API + Postgres (pgvector) + Redis. See docs/DEPLOY.md.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
#
# Free-plan trade-offs:
# - No Celery worker (workers are paid): CELERY_TASK_ALWAYS_EAGER runs tasks inside the API.
#   Scheduled jobs (08:00 reminders, nightly rescoring) don't run; user-triggered ones do.
# - The API sleeps after ~15 min idle; the first request then takes ~1 min to wake it.
# - Free Postgres expires after 30 days (Render emails you); recreate it and redeploy.
# - No Shell on free: demo data is loaded on start when the database is empty.
databases:
  - name: leadpilot-db
    plan: free
    databaseName: leadpilot
    user: leadpilot

services:
  - type: keyvalue
    name: leadpilot-redis
    plan: free
    ipAllowList: [] # only reachable from this account's services

  - type: web
    name: leadpilot-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py seed_demo --if-empty &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leadpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: leadpilot-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      # Set these to your Vercel URL, e.g. https://leadpilot.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # GenAI: leave empty for offline mode, or add a key.
      - key: GROQ_API_KEY
        sync: false
      # The real embedding model needs ~1 GB RAM; "hash" fits the free 512 MB instance.
      - key: EMBEDDINGS_BACKEND
        value: hash
      # Razorpay TEST keys only (optional; leave empty to skip payments).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
