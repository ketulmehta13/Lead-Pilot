name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: leadpilot
          POSTGRES_USER: leadpilot
          POSTGRES_PASSWORD: leadpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadpilot" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests
        run: pytest --cov --cov-report=term-missing --junitxml=junit.xml
        env:
          DATABASE_URL: postgres://leadpilot:leadpilot@localhost:5432/leadpilot
      - name: Report failing tests as annotations
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          if not Path("junit.xml").exists():
              raise SystemExit(0)
          for case in ET.parse("junit.xml").iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  msg = (bad.get("message") or bad.text or "").replace("\n", " ")[:400]
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
