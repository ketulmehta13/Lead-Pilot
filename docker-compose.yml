name: leadpilot

x-backend: &backend
  # One image shared by backend, celery and celery-beat (built once, by "backend").
  image: leadpilot-backend:dev
  pull_policy: never
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-leadpilot}:${POSTGRES_PASSWORD:-leadpilot}@postgres:5432/${POSTGRES_DB:-leadpilot}
    REDIS_URL: redis://redis:6379/0
    # The slim image has no PyTorch, so RAG uses hash embeddings. For real embeddings set
    # DOCKER_WITH_EMBEDDINGS=1 and DOCKER_EMBEDDINGS_BACKEND=sentence-transformers in .env.
    EMBEDDINGS_BACKEND: ${DOCKER_EMBEDDINGS_BACKEND:-hash}
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadpilot}
      POSTGRES_USER: ${POSTGRES_USER:-leadpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadpilot}
    ports:
      # Host port 5433 so a locally installed Postgres on 5432 doesn't clash.
      # Containers still reach it as postgres:5432 on the compose network.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadpilot} -d ${POSTGRES_DB:-leadpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    build:
      context: ./backend
      args:
        WITH_EMBEDDINGS: ${DOCKER_WITH_EMBEDDINGS:-0}
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  celery:
    <<: *backend
    command: celery -A config worker --loglevel=info --pool=solo

  celery-beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
